<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techi بيت 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D apartment; floating glass panels for products (start side), product card (end side) and phone notifications. */
:root{
  --panel:#FFFFFFE8; --panel-solid:#FFFFFF; --ink:#141B26; --muted:#5B6576; --line:#DDE3EB;
  --accent:#1F6FEB; --accent-ink:#FFFFFF; --glow:#F2A93B; --ok:#1E8E5A; --alert:#D9372B; --wa:#1FA855;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --panel:#121A25E6; --panel-solid:#121A25; --ink:#E9EEF4; --muted:#9AA6B6; --line:#283447;
  --accent:#5B9BFF; --accent-ink:#0B1220; --glow:#F5B451; --ok:#3BC283; --alert:#FF6B5E; --wa:#2BC067; color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:#121A25E6; --panel-solid:#121A25; --ink:#E9EEF4; --muted:#9AA6B6; --line:#283447;
  --accent:#5B9BFF; --accent-ink:#0B1220; --glow:#F5B451; --ok:#3BC283; --alert:#FF6B5E; --wa:#2BC067; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#0B1220;color:var(--ink);font:15px/1.6 var(--body)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px #0004}

/* top bar */
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{padding:8px 16px;display:flex;align-items:baseline;gap:10px}
.brand b{font:700 1.25rem var(--display)}
.brand b span{color:var(--glow)}
.brand small{color:var(--muted)}
.tools{display:flex;gap:8px}
.tbtn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--glow)}

/* side panel */
.side{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));inset-inline-start:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 90px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:14px;z-index:4;display:grid;gap:14px;align-content:start}
.side h2{font:700 .8rem var(--display);color:var(--muted);margin:0;letter-spacing:.03em}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.scenes button{border:1px solid var(--line);background:var(--panel-solid);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.85rem;font-weight:600;line-height:1.3}
.scenes button.run{border-color:var(--glow);box-shadow:0 0 0 2px var(--glow)}
.room{display:grid;gap:4px}
.room h3{margin:4px 0 2px;font:600 .82rem var(--display);color:var(--muted)}
.prod{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;width:100%;text-align:start;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;cursor:pointer}
.prod:hover{background:var(--panel-solid);border-color:var(--line)}
.prod.sel{background:var(--panel-solid);border-color:var(--accent)}
.prod .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 .72rem var(--display);background:var(--accent);color:var(--accent-ink)}
.prod .t{font-size:.9rem;line-height:1.35}
.chip{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--glow) 25%,transparent);color:var(--ink)}
.chip.alert{background:var(--alert);color:#fff}
.hint{font-size:.78rem;color:var(--muted)}

/* info card */
.info{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-left,0px));width:340px;padding:18px;z-index:4;display:grid;gap:8px}
.info .room-l{font:600 .78rem var(--display);color:var(--accent)}
.info h3{margin:0;font:700 1.15rem var(--display);line-height:1.35}
.info p{margin:0;color:var(--muted);font-size:.9rem}
.info .did{color:var(--ink);background:color-mix(in srgb,var(--glow) 18%,transparent);border-radius:10px;padding:8px 10px;font-size:.88rem}
.info .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.price{font:700 1.05rem var(--display);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font:600 .9rem var(--display);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:#fff}
.close{position:absolute;top:8px;inset-inline-end:8px;border:0;background:transparent;cursor:pointer;font-size:1.1rem;color:var(--muted);width:32px;height:32px;border-radius:8px}

/* phone notification */
.toast{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-left,0px));width:320px;padding:12px 14px;z-index:6;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;transform:translateY(-12px);opacity:0;transition:.35s;pointer-events:none}
.toast.show{transform:none;opacity:1}
.toast .ic{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--glow);display:grid;place-items:center;font:700 1rem var(--display)}
.toast b{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.toast span{font-size:.9rem;font-weight:600}
.toast.alert .ic{background:var(--alert);color:#fff}

/* 3D pins */
#pins{position:fixed;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font:700 .72rem var(--display);display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:0 2px 10px #0006;transition:transform .2s}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #fff8;animation:ring 2.2s infinite}
.pin.sel{background:var(--glow);color:#141B26;transform:scale(1.2)}
.pin.alert{background:var(--alert)}
.pin .lbl{position:absolute;bottom:32px;white-space:nowrap;background:var(--panel-solid);color:var(--ink);font:600 .78rem var(--body);padding:3px 8px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;border:1px solid var(--line)}
.pin:hover .lbl,.pin.sel .lbl{opacity:1}
body.hidepins .pin{display:none}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}

.loading{position:fixed;inset:0;display:grid;place-items:center;color:#E9EEF4;font:600 1.1rem var(--display);z-index:10;background:#0B1220;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:760px){
  .brand small{display:none}
  .tbtn{padding:7px 10px;font-size:.85rem}
  .side{top:auto;bottom:0;inset-inline:0;width:auto;max-height:38%;border-radius:16px 16px 0 0;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .info{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-left,0px));width:auto;padding:12px 14px}
  .info .desc{display:none}
  .toast{top:calc(64px + env(safe-area-inset-top,0px));inset-inline:max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-left,0px));width:auto}
}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="مجسم 3D لشقة ذكية، اسحب عشان تلف، ودوس على أي منتج"></div>
<div id="pins"></div>
<div class="loading" id="loading">بنجهّز البيت…</div>

<header class="top">
  <div class="brand glass"><b>Techi<span>.</span></b><small>جرّب بيتك الذكي، دوس على أي جهاز</small></div>
  <div class="tools">
    <button class="tbtn" id="dayBtn" aria-pressed="false">☀️ نهار</button>
    <button class="tbtn" id="pinsBtn" aria-pressed="true">الأرقام</button>
    <button class="tbtn" id="homeBtn">البيت كله</button>
  </div>
</header>

<aside class="side glass" id="side">
  <h2>سيناريوهات بلمسة واحدة</h2>
  <div class="scenes">
    <button data-scene="sleep">تصبح على خير</button>
    <button data-scene="away">خارج البيت</button>
    <button data-scene="home">راجع البيت</button>
  </div>
  <h2>الأجهزة في البيت</h2>
  <div id="list"></div>
  <p class="hint">اسحب عشان تلف حوالين البيت، واعمل زووم بالعجلة أو بصباعين.</p>
</aside>

<section class="info glass" id="info" hidden aria-live="polite">
  <button class="close" id="infoClose" aria-label="اقفل">×</button>
  <span class="room-l" id="iRoom"></span>
  <h3 id="iName"></h3>
  <p class="desc" id="iDesc"></p>
  <div class="did" id="iDid"></div>
  <div class="row">
    <span class="price" id="iPrice"></span>
    <div style="display:flex;gap:6px">
      <button class="btn main" id="iAgain">جرّبه تاني</button>
      <a class="btn wa" id="iWa" href="#" target="_blank" rel="noopener">اطلبه</a>
    </div>
  </div>
</section>

<div class="toast glass" id="toast" role="status"><div class="ic">T</div><div><b>Techi Home · دلوقتي</b><span id="toastMsg"></span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function(){
"use strict";
const WA_NUMBER = "201000000000"; // TODO: رقم واتساب الشركة
const $ = id => document.getElementById(id);
if(!window.THREE){ $("loading").textContent="المتصفح ماحمّلش مكتبة الـ 3D. جرّب تفتح الصفحة تاني."; return; }

/* ============ renderer / scene ============ */
const stage=$("stage");
let R;
try{ R=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"}); }
catch(e){ $("loading").textContent="الجهاز ده مش بيدعم WebGL، جرّب من متصفح تاني."; return; }
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.05;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(R.domElement);

const scene=new THREE.Scene();
const NIGHT_BG=new THREE.Color("#0B1220"), DAY_BG=new THREE.Color("#BFD6E8");
scene.background=NIGHT_BG.clone();
scene.fog=new THREE.Fog(scene.background,30,60);
const pmrem=new THREE.PMREMGenerator(R);
scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(38,1,0.1,120);
const controls=new THREE.OrbitControls(camera,R.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.maxPolarAngle=1.38; controls.minDistance=2.5; controls.maxDistance=45;
controls.enablePan=true; controls.screenSpacePanning=true;

const hemi=new THREE.HemisphereLight("#dfe9ff","#3a2f25",0.15); scene.add(hemi);
const sun=new THREE.DirectionalLight("#fff1dc",0);
sun.position.set(-7,10,-12); sun.target.position.set(-2,0,-1);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:40});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

/* ============ materials & textures ============ */
const allMats=[];
function M(color,o={}){
  const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:o.r??0.7,metalness:o.m??0},o.extra||{}));
  if(o.map) m.map=o.map;
  if(o.em){m.emissive=new THREE.Color(o.em);m.emissiveIntensity=o.ei??0;}
  if(o.side) m.side=o.side;
  if(o.op!=null){m.transparent=true;m.opacity=o.op;}
  allMats.push(m); return m;
}
function canvasTex(w,h,draw,rep){
  const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=R.capabilities.getMaxAnisotropy();
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
function rnd(a,b){return a+Math.random()*(b-a)}
function wood(base,rep){
  return canvasTex(1024,1024,(g,w,h)=>{
    const rows=8, ph=h/rows;
    for(let r=0;r<rows;r++){
      let x=-rnd(0,300);
      while(x<w){
        const len=rnd(280,520), l=rnd(-7,7);
        g.fillStyle=`hsl(${base[0]+rnd(-3,3)},${base[1]+rnd(-6,6)}%,${base[2]+l}%)`;
        g.fillRect(x,r*ph,len,ph);
        g.globalAlpha=.12;
        for(let k=0;k<14;k++){g.strokeStyle=Math.random()<.5?"#000":"#fff";g.lineWidth=rnd(.5,2);g.beginPath();const yy=r*ph+rnd(4,ph-4);g.moveTo(x,yy);g.bezierCurveTo(x+len*.3,yy+rnd(-5,5),x+len*.6,yy+rnd(-5,5),x+len,yy+rnd(-3,3));g.stroke();}
        g.globalAlpha=1; g.fillStyle="rgba(0,0,0,.35)"; g.fillRect(x,r*ph,2,ph);
        x+=len;
      }
      g.fillStyle="rgba(0,0,0,.3)"; g.fillRect(0,r*ph,w,2);
    }
  },rep);
}
function tiles(c1,grout,n,rep){
  return canvasTex(512,512,(g,w,h)=>{
    g.fillStyle=grout; g.fillRect(0,0,w,h); const s=w/n;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){g.fillStyle=c1;g.globalAlpha=1;g.fillRect(i*s+3,j*s+3,s-6,s-6);
      g.globalAlpha=.06;for(let k=0;k<40;k++){g.fillStyle=Math.random()<.5?"#000":"#fff";g.fillRect(i*s+rnd(4,s-6),j*s+rnd(4,s-6),rnd(1,4),rnd(1,4));}}
    g.globalAlpha=1;
  },rep);
}
const rugTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle="#8C7B6B";g.fillRect(0,0,w,h);g.strokeStyle="#E7DED2";g.lineWidth=10;g.strokeRect(24,24,w-48,h-48);
  g.lineWidth=3;g.strokeRect(46,46,w-92,h-92);
  for(let i=0;i<6;i++){g.strokeStyle=i%2?"#C9A66B":"#E7DED2";g.beginPath();g.moveTo(80,90+i*66);for(let x=80;x<w-80;x+=32){g.lineTo(x+16,90+i*66+(x/32%2?14:-14));}g.stroke();}
  g.globalAlpha=.08;for(let k=0;k<4000;k++){g.fillStyle=Math.random()<.5?"#000":"#fff";g.fillRect(rnd(0,w),rnd(0,h),2,2);}
});

const mat={
  wall:M("#ECE7DF",{r:.95}), cap:M("#2A2F37",{r:.8}), trim:M("#F7F4EF",{r:.6}),
  plinth:M("#1D2229",{r:.9}), ground:M("#3B4A3E",{r:1}),
  oak:M("#ffffff",{r:.55,map:wood([30,45,42],[2.2,2.2])}),
  oakLight:M("#ffffff",{r:.55,map:wood([34,40,58],[1.6,1.6])}),
  tile:M("#ffffff",{r:.35,map:tiles("#D9D5CE","#AFA9A0",4,[2.5,2])}),
  hallTile:M("#ffffff",{r:.4,map:tiles("#CDC6BC","#A39B90",3,[3,1.2])}),
  rug:M("#ffffff",{r:1,map:rugTex}),
  fabric:M("#56677A",{r:1}), fabric2:M("#C9A66B",{r:1}), fabric3:M("#E6E0D6",{r:1}),
  woodDark:M("#5A3E2B",{r:.5}), woodMid:M("#8A6446",{r:.5}),
  black:M("#17191D",{r:.4,m:.4}), steel:M("#C9CED4",{r:.28,m:.85}), brass:M("#B48A4C",{r:.35,m:.9}),
  counter:M("#EFEEEA",{r:.3}), cabinet:M("#3F5B54",{r:.55}),
  plant:M("#4E7A43",{r:.85}), plant2:M("#3E6A3A",{r:.85}), pot:M("#C7B8A4",{r:.8}),
  white:M("#F4F5F6",{r:.35}), skin:M("#C99B7A",{r:.7}), shirt:M("#2F4A6B",{r:.9}),
  duvet:M("#DED8CE",{r:1}), throw:M("#8A9A7B",{r:1}), headboard:M("#7C6B5C",{r:1}),
  curtain:M("#EAE3D7",{r:1,side:THREE.DoubleSide}),
  glass:M("#9FC3E0",{r:.05,m:0,op:.18}),
  water:M("#BFE3FF",{r:.05,op:.7,em:"#9fd3ff",ei:.4}),
};
mat.glass.depthWrite=false;
const bulbMat=()=>M("#FFF4E0",{r:.3,em:"#FFC98A",ei:0});
const shadeMat=()=>M("#F1EBDF",{r:.9,em:"#FFB866",ei:0,side:THREE.DoubleSide});

/* ============ helpers ============ */
const root=new THREE.Group(); scene.add(root);
function add(mesh,parent,cast=true,recv=true){mesh.castShadow=cast;mesh.receiveShadow=recv;(parent||root).add(mesh);return mesh;}
function box(w,h,d,m,x,y,z,p,round){
  const g=round?new THREE.RoundedBoxGeometry(w,h,d,3,Math.min(round,w/2-.001,h/2-.001,d/2-.001)):new THREE.BoxGeometry(w,h,d);
  const me=new THREE.Mesh(g,m); me.position.set(x,y,z); return add(me,p);
}
function cyl(rt,rb,h,m,x,y,z,p,seg=24){const me=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);me.position.set(x,y,z);return add(me,p);}
function sph(r,m,x,y,z,p){const me=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);me.position.set(x,y,z);return add(me,p);}
function pointLight(color,x,y,z,dist=6){const l=new THREE.PointLight(color,0,dist,2);l.position.set(x,y,z);root.add(l);return l;}

/* ============ structure ============ */
const H=2.8,T=0.15;
box(12.9,0.4,8.9,mat.plinth,0,-0.25,0);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,64),mat.ground); ground.rotation.x=-Math.PI/2; ground.position.y=-0.45; add(ground,null,false,true);
// floors
box(7,0.04,5.6,mat.oak,-2.5,-0.02,-1.2);       // living
box(7,0.04,2.4,mat.hallTile,-2.5,-0.02,2.8);   // hall
box(5,0.04,4,mat.tile,3.5,-0.02,-2);           // kitchen
box(5,0.04,4,mat.oakLight,3.5,-0.02,2);        // bedroom

const walls={};
function wall(id,axis,fixed,a0,a1,openings,outward){
  const full=new THREE.Group(), cut=new THREE.Group(); root.add(full,cut);
  const piece=(s,e,y0,y1,grp,m)=>{
    if(e-s<=0.001||y1-y0<=0.001)return;
    const c=(s+e)/2, yc=(y0+y1)/2;
    if(axis==="x") box(e-s,y1-y0,T,m,c,yc,fixed,grp); else box(T,y1-y0,e-s,m,fixed,yc,c,grp);
  };
  let cur=a0-T/2;
  openings.sort((a,b)=>a.s-b.s).forEach(o=>{
    piece(cur,o.s,0,H,full,mat.wall); piece(o.s,o.e,0,o.b,full,mat.wall); piece(o.s,o.e,o.t,H,full,mat.wall); cur=o.e;
    // glass + frame
    if(o.glass){
      const len=o.e-o.s, hh=o.t-o.b;
      if(axis==="x"){box(len,hh,0.02,mat.glass,(o.s+o.e)/2,(o.b+o.t)/2,fixed,full).castShadow=false;

  hubLed.material.emissiveIntensity=S.hub>0?1.5+Math.sin(t*12):0.8;
  // gas
  gasAlarm.intensity=S.gas?(1.6+Math.sin(t*9)*1.4):0;gasLedMat.emissive.set(S.gas?(Math.sin(t*12)>0?"#FF2A1F":"#330000"):"#3BC283");
  // valve + water
  A.valve=lerp(A.valve,S.valveOpen?0:Math.PI/2,k);valveHandle.rotation.z=A.valve;
  valveLedMat.emissive.set(S.valveOpen?"#3BC283":"#D9372B");
  water.visible=S.valveOpen&&S.waterRun;water.scale.x=water.scale.z=1+Math.sin(t*30)*0.08;
  // person walking + motion sensor
  if(person.visible&&walk.path.length){const tgt=walk.path[0];tmp.copy(tgt).sub(person.position);tmp.y=0;const dist=tmp.length();
    if(dist<0.05){walk.path.shift();if(!walk.path.length&&walk.done){const r=walk.done;walk.done=null;r();}}
    else{tmp.normalize();person.position.addScaledVector(tmp,Math.min(dist,walk.speed*dt));person.rotation.y=Math.atan2(tmp.x,tmp.z);person.position.y=Math.abs(Math.sin(t*9))*0.04;}}
  const inHall=person.visible&&person.position.x>-6.1&&person.position.z>1.5;
  if(inHall&&!S.light.hall){S.light.hall=1;S.motion=1;refreshUI();}
  if(S.light.hall&&!inHall){S.motion=Math.max(0,(S.motion||1)-dt*0.25);if(S.motion<=0.01){S.motion=0;S.light.hall=0;refreshUI();}}
  motionLedMat.emissiveIntensity=inHall?(Math.sin(t*14)>0?2:0):0;
  // wall cutaway
  for(const id in walls){const w=walls[id];tmp.copy(camera.position).sub(w.center);const cut=tmp.dot(w.outward)>0;
    if(cut!==w.isCut){w.isCut=cut;w.full.visible=!cut;w.cut.visible=cut;w.attached.forEach(o=>o.visible=!cut);}}
  // pins
  const W=innerWidth,Hh=innerHeight;
  for(const p of P){const el=$("pin-"+p.id);tmp.copy(p.v).project(camera);
    const hidden=tmp.z>1||(p.wall&&walls[p.wall].isCut);
    if(hidden){el.style.visibility="hidden";continue;}
    el.style.visibility="visible";el.style.transform=`translate(${(tmp.x*.5+.5)*W}px,${(-tmp.y*.5+.5)*Hh}px)`;}
  R.render(scene,camera);
  requestAnimationFrame(frame);
}
drawTV();refreshUI();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{drawTV();drawPanel();});
requestAnimationFrame(frame);
setTimeout(()=>$("loading").classList.add("done"),300);
setTimeout(()=>toast("دوس على أي رقم أو أي جهاز في البيت وشوف بيعمل إيه"),1400);
})();
</script>
